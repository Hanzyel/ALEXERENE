:root{--navy:#17383b;--navy2:#214b4d;--paper:#f4f7f6;--accent:#4e756d;--accent2:#8faea2}
body{background:#eef3f1}
.sidebar{background:linear-gradient(180deg,#15383b 0%,#173f42 58%,#102f32 100%);padding:16px 13px}
.brandless-head{padding:8px 8px 14px;margin-bottom:10px}
.brandless-icon{display:none}
.brandless-head span{font-size:8px;color:#9ab8b1}
.brandless-head strong{font-size:13px;letter-spacing:.005em}
.project-mini{border-radius:12px;background:rgba(255,255,255,.035);padding:12px}
.nav button{border-radius:9px;padding:8px 9px;font-size:11.5px}
.nav button.active{box-shadow:none}
.ico{width:25px;height:25px;border-radius:7px;font-size:10px}
.topbar{height:70px;background:rgba(248,250,249,.96);padding:0 24px}
.topbar h1{font-size:17px}
.content{padding:22px 24px 44px}
.hero{border-radius:16px;padding:22px 24px;background:linear-gradient(118deg,#153b3e 0%,#285759 68%,#577a6f 100%);box-shadow:0 10px 26px rgba(14,47,45,.12)}
.hero:after{display:none}
.hero h2{font-size:25px;margin:7px 0 6px}
.hero p{font-size:11.8px;line-height:1.55}
.hero-stat{min-width:155px;border-radius:11px;background:rgba(255,255,255,.08)}
.hero-stat strong{font-size:16px}
.kicker{font-size:8.8px}
.badge{font-size:9px;padding:5px 8px}
.card,.kpi{border-radius:14px;box-shadow:0 4px 16px rgba(20,52,49,.055)}
.card:hover{box-shadow:0 6px 20px rgba(20,52,49,.07)}
.card-head{padding:14px 16px 11px}
.card-body{padding:14px 16px}
.kpi{padding:15px;min-height:114px}
.kpi:after{display:none}
.kpi .value{font-size:22px}
.client-guide{border-radius:12px;padding:12px 14px;background:#f8fbfa;box-shadow:none}
.client-guide .guide-icon{width:29px;height:29px;border-radius:8px;font-size:9px;background:#254d4d}
.story-step{border-radius:12px;box-shadow:none}
.explain-card{border-radius:11px}
.section-title h2{font-size:15.5px}
.table th{background:#f5f8f7}
.table tr:hover td{background:#f7faf9}

/* resumo institucional */
.exec-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.exec-meta .meta-item{font-size:9px;color:#d6e4df;border-right:1px solid rgba(255,255,255,.2);padding-right:12px}
.exec-meta .meta-item:last-child{border-right:0}
.exec-meta b{color:#fff;font-weight:850}
.panel-caption{font-size:9px;color:var(--muted);line-height:1.45;margin-top:7px}
.data-note{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;border:1px solid #dce6e2;background:#fbfdfc;border-radius:10px;color:#5d716d;font-size:9.7px;line-height:1.45}
.data-note b{color:#233f3d}
.data-note .mark{width:7px;height:7px;border-radius:50%;background:#5f8579;margin-top:4px;flex:0 0 auto}

/* projeção de conclusão */
.projection-shell{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}
.projection-main{border:1px solid var(--line);background:linear-gradient(145deg,#fff,#f6faf8);border-radius:14px;padding:18px}
.projection-value{font-size:34px;font-weight:900;letter-spacing:-.045em;color:#173e40;margin:6px 0 2px}
.projection-sub{font-size:10px;color:var(--muted);line-height:1.5}
.projection-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:14px}
.projection-mini{padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}
.projection-mini span{display:block;font-size:8.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:800}
.projection-mini strong{display:block;margin-top:5px;font-size:14px;color:#214846}
.projection-control{border:1px solid var(--line);border-radius:14px;padding:17px;background:#fff}
.projection-control label{font-size:9px;text-transform:uppercase;letter-spacing:.08em;font-weight:850;color:var(--muted)}
.projection-control input[type=range]{width:100%;accent-color:#3e6d65;margin:14px 0 6px}
.progress-read{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.progress-read strong{font-size:25px;color:#173f42}
.progress-read small{font-size:9px;color:var(--muted)}
.scenario-line{display:grid;grid-template-columns:1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid #edf2f0;font-size:9.7px}
.scenario-line:last-child{border-bottom:0}
.scenario-line b{font-variant-numeric:tabular-nums}

/* refinanciamento */
.refi-state{border:1px solid #d6e2de;border-radius:13px;background:#f9fcfb;padding:14px 15px;display:flex;gap:12px;align-items:flex-start}
.refi-state .sig{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#e6efec;color:#244d48;font-weight:900}
.refi-state strong{font-size:11px}.refi-state p{font-size:9.7px;color:var(--muted);line-height:1.5;margin:4px 0 0}
.refi-editor{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.refi-editor .field.span4{grid-column:span 4}
.refi-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.refi-group{display:grid;grid-template-columns:1fr 130px;gap:9px;align-items:center;padding:8px 9px;border:1px solid var(--line);border-radius:9px}
.refi-group span{font-size:9.5px;font-weight:750}
.refi-group input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:9.5px;text-align:right}
.triple-compare{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.triple-item{border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff}
.triple-item span{font-size:8.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:800}
.triple-item strong{display:block;margin-top:6px;font-size:16px}
.triple-item small{display:block;margin-top:4px;font-size:8.8px;color:var(--muted);line-height:1.35}

/* relatório fotográfico */
.report-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:11px}
.upload-panel{border:1px solid var(--line);border-radius:13px;padding:15px;background:#fff}
.upload-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.photo-input{position:relative;border:1px dashed #b9cbc5;border-radius:11px;background:#f8fbfa;padding:16px;text-align:center;cursor:pointer}
.photo-input input{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo-input strong{display:block;font-size:10px;color:#254b48}.photo-input span{display:block;font-size:8.8px;color:var(--muted);margin-top:4px}
.photo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.photo-card{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;box-shadow:0 3px 12px rgba(20,52,49,.04)}
.photo-thumb{aspect-ratio:4/3;background:#e7eeeb;overflow:hidden;cursor:zoom-in}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s ease}
.photo-thumb:hover img{transform:scale(1.02)}
.photo-info{padding:10px}
.photo-info .photo-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.photo-info .photo-tags span{font-size:7.8px;text-transform:uppercase;letter-spacing:.04em;font-weight:800;padding:4px 5px;border-radius:999px;background:#edf3f1;color:#4d6862}
.photo-info strong{display:block;font-size:10px;line-height:1.35}
.photo-info p{font-size:8.8px;color:var(--muted);line-height:1.4;margin:4px 0}
.photo-actions{display:flex;justify-content:space-between;gap:6px;margin-top:8px}
.photo-actions button{font-size:8.5px;padding:5px 7px}
.report-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.report-kpi{border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}
.report-kpi span{font-size:8.2px;text-transform:uppercase;color:var(--muted);font-weight:800;letter-spacing:.06em}
.report-kpi strong{display:block;margin-top:5px;font-size:15px}
.measure-list{display:flex;flex-direction:column;gap:8px}
.measure-card{border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fff}
.measure-card-head{display:flex;justify-content:space-between;gap:10px}
.measure-card strong{font-size:10px}.measure-card small{font-size:8.5px;color:var(--muted)}
.measure-card p{font-size:8.8px;color:var(--muted);margin:5px 0 0}
.report-empty{border:1px dashed #cad8d3;border-radius:12px;padding:26px;text-align:center;color:#758984;font-size:9.5px;background:#fafcfb}
.photo-modal{position:fixed;inset:0;background:rgba(8,27,28,.82);z-index:99;display:none;align-items:center;justify-content:center;padding:25px}
.photo-modal.open{display:flex}.photo-modal img{max-width:min(1200px,94vw);max-height:86vh;object-fit:contain;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.photo-modal button{position:absolute;right:24px;top:20px;border:0;background:#fff;color:#173d3f;border-radius:9px;padding:8px 10px;font-weight:900;cursor:pointer}
.photo-status{font-size:9px;color:#60736f;margin-top:8px}
.report-print-title{display:none}

/* alerta de arquivo ausente */
.missing-source{border-left:3px solid #b9874d;background:#fffaf4;padding:11px 13px;border-radius:8px;font-size:9.6px;color:#725a3c;line-height:1.5}
.missing-source strong{color:#5e4529}

@media(max-width:1150px){.projection-shell{grid-template-columns:1fr}.refi-editor{grid-template-columns:repeat(2,minmax(0,1fr))}.refi-editor .field.span4{grid-column:span 2}.photo-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.report-summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:820px){.content{padding:13px}.hero{border-radius:13px}.projection-grid,.triple-compare,.refi-groups,.upload-grid,.photo-grid,.report-summary{grid-template-columns:1fr}.refi-editor{grid-template-columns:1fr}.refi-editor .field.span4{grid-column:auto}.refi-group{grid-template-columns:1fr}.hero-stat{min-width:135px}}
@media print{
  .upload-panel,.photo-actions,.report-toolbar .btn,.projection-control input[type=range],.refi-state .btn{display:none!important}
  .photo-grid{grid-template-columns:repeat(2,1fr)}
  .photo-card{break-inside:avoid}
  .report-print-title{display:block;font-size:18px;margin:0 0 12px}
}


/* ===== V5 REFINANCIAMENTO INCORPORADO ===== */
.refi-source{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:14px 16px;border:1px solid #c8dad5;border-radius:15px;background:linear-gradient(135deg,#f7fbf9,#eef6f2);margin-bottom:14px}.refi-source strong{font-size:11px;display:block;color:#173f42}.refi-source p{font-size:9.8px;color:#637772;line-height:1.48;margin:4px 0 0}.refi-source .source-chip{flex:0 0 auto;padding:6px 9px;border-radius:999px;background:#173f42;color:white;font-size:8.5px;font-weight:850;letter-spacing:.05em;text-transform:uppercase}.refi-flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.refi-step{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;position:relative}.refi-step:before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:3px;border-radius:5px;background:#476f6b}.refi-step span{display:block;font-size:8.3px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:850}.refi-step strong{display:block;font-size:17px;margin-top:5px;letter-spacing:-.025em}.refi-step small{display:block;font-size:9px;color:var(--muted);line-height:1.35;margin-top:5px}.refi-step.gain:before{background:#4d8168}.refi-step.warn:before{background:#b98242}.refi-step.bad:before{background:#b94e51}.refi-delta{font-variant-numeric:tabular-nums;font-weight:850}.refi-delta.pos{color:#356d59}.refi-delta.zero{color:#81908d}.refi-usage{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center;min-width:135px}.refi-usage .track{height:7px;border-radius:99px;background:#edf2f0;overflow:hidden}.refi-usage .track i{display:block;height:100%;background:#4a746e;border-radius:99px}.revision-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.revision-item{padding:11px 12px;border-radius:12px;background:#f8fbfa;border:1px solid var(--line)}.revision-item span{display:block;font-size:8.6px;color:var(--muted)}.revision-item strong{display:block;font-size:11px;margin-top:4px}.revision-item b{display:block;font-size:12px;color:#315f58;margin-top:5px}.sufficiency{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.sufficiency-main{padding:17px;border-radius:15px;border:1px solid var(--line);background:linear-gradient(145deg,#143d40,#315f5c);color:white}.sufficiency-main span{font-size:8.4px;text-transform:uppercase;letter-spacing:.09em;color:#bed4cd;font-weight:850}.sufficiency-main strong{display:block;font-size:28px;letter-spacing:-.04em;margin:6px 0}.sufficiency-main p{font-size:9.6px;line-height:1.45;color:#d8e6e2;margin:0}.sufficiency-side{display:flex;flex-direction:column;gap:8px}.sufficiency-box{flex:1;padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff}.sufficiency-box span{display:block;font-size:8.2px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:850}.sufficiency-box b{display:block;font-size:14px;margin-top:5px}.source-foot{font-size:8.7px;color:#72837f;line-height:1.5;margin-top:10px}.source-foot code{font-family:inherit;background:#edf3f1;padding:2px 5px;border-radius:5px;color:#375c56}.refi-kpi-note{font-size:9.5px;line-height:1.45;color:#5f746f;margin-top:7px}.refi-impact{border:1px solid #cadbd6;background:#f7fbf9;border-radius:16px;padding:15px 16px;margin-top:14px}.refi-impact-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.refi-impact-head span{font-size:8.5px;text-transform:uppercase;letter-spacing:.1em;color:#6f817d;font-weight:850}.refi-impact-head strong{display:block;font-size:13px;margin-top:4px}.refi-impact-head b{font-size:15px;color:#295d54}.refi-impact-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}.refi-impact-grid div{background:#fff;border:1px solid #dbe6e3;border-radius:11px;padding:10px}.refi-impact-grid span{font-size:8.2px;text-transform:uppercase;letter-spacing:.07em;color:#798a86}.refi-impact-grid strong{display:block;font-size:12px;margin-top:4px}.refi-impact-grid small{display:block;font-size:8.5px;color:var(--muted);margin-top:3px;line-height:1.35}
@media(max-width:1100px){.refi-flow,.refi-impact-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.revision-list{grid-template-columns:repeat(2,minmax(0,1fr))}.sufficiency{grid-template-columns:1fr}}
@media(max-width:700px){.refi-flow,.refi-impact-grid,.revision-list{grid-template-columns:1fr}.refi-source{flex-direction:column}.refi-source .source-chip{align-self:flex-start}}


/* ===== V7: biblioteca de projetos + projeção executiva dinâmica ===== */
.projection-control .progress-inputs{display:grid;grid-template-columns:1fr 86px;gap:10px;align-items:center;margin:8px 0 3px}.projection-control .progress-inputs input[type=number]{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 9px;background:#fff;color:var(--ink);font-weight:850;text-align:center;outline:none}.projection-control .progress-inputs input[type=number]:focus{border-color:#8eaea4;box-shadow:0 0 0 3px #e6f0ec}.projection-control .progress-inputs input[type=range]{width:100%}.projection-live{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:999px;background:#e8f2ed;color:#2e6757;font-size:8.5px;font-weight:900;letter-spacing:.04em;text-transform:uppercase}.projection-live:before{content:"";width:6px;height:6px;border-radius:50%;background:#428369;box-shadow:0 0 0 3px rgba(66,131,105,.12)}
.projects-hero{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:17px 18px;border:1px solid #dbe6e2;border-radius:18px;background:linear-gradient(135deg,#fff,#f3f8f6);box-shadow:var(--shadow2);margin-bottom:14px}.projects-hero h3{font-size:14px;margin:0 0 5px}.projects-hero p{font-size:10.3px;color:var(--muted);line-height:1.5;margin:0;max-width:800px}.drive-state{display:flex;align-items:center;gap:7px;white-space:nowrap;padding:7px 10px;border-radius:999px;background:#e8f2ed;color:#2f6658;font-size:9px;font-weight:850}.drive-state i{width:7px;height:7px;border-radius:50%;background:#44806a;box-shadow:0 0 0 3px rgba(68,128,106,.12)}
.project-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}.project-search{flex:1;min-width:240px;position:relative}.project-search input{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px 10px 34px;background:#fff;outline:none;font-size:10.5px}.project-search input:focus{border-color:#93b0a7;box-shadow:0 0 0 3px #e7f0ec}.project-search:before{content:"⌕";position:absolute;left:12px;top:8px;color:#748783;font-size:14px}.discipline-tabs{display:flex;gap:4px;overflow:auto;padding:3px;background:#edf3f0;border-radius:11px}.discipline-tabs button{border:0;background:transparent;color:#60736f;border-radius:8px;padding:7px 10px;font-size:9px;font-weight:850;white-space:nowrap;cursor:pointer}.discipline-tabs button.active{background:#fff;color:#173f42;box-shadow:0 3px 9px rgba(28,63,59,.08)}
.project-workspace{display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px;align-items:start}.project-catalog{background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow2);overflow:hidden}.project-catalog-head{padding:12px 13px;border-bottom:1px solid #edf2f0;display:flex;justify-content:space-between;align-items:center}.project-catalog-head strong{font-size:10.5px}.project-catalog-head span{font-size:9px;color:var(--muted)}.project-list{max-height:720px;overflow:auto;padding:6px}.project-doc{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:9px;align-items:center;text-align:left;border:1px solid transparent;background:transparent;padding:9px;border-radius:11px;cursor:pointer;color:var(--ink)}.project-doc:hover{background:#f5f9f7}.project-doc.active{background:#edf6f2;border-color:#cfe0da;box-shadow:inset 3px 0 0 #315f5b}.project-doc .doc-ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#edf3f1;color:#315f5b;font-size:9px;font-weight:900}.project-doc.zip .doc-ico{background:#fff1df;color:#91602d}.project-doc strong{display:block;font-size:9.8px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.project-doc small{display:block;font-size:8.7px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.project-doc .doc-size{font-size:8px;color:#879792;white-space:nowrap}.project-empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:10px;line-height:1.5}

function layHelp(title,text,tone=''){return `<div class="explain-card lay-help ${tone}"><div class="explain-title"><i>i</i>${esc(title)}</div><p>${text}</p></div>`}

function plainPhase(p){const map={'ESTRUTURAS':'Estrutura','REVESTIMENTOS':'Revestimentos e pisos','ALVENARIA':'Alvenaria','PINTURAS':'Pintura','ESQUADRIAS':'Esquadrias','COBERTURA':'Cobertura','INSTALAÇÕES HIDRAULICAS':'Instalações hidráulicas','INSTALAÇÕES ELÉTRICAS':'Instalações elétricas','FUNDAÇÕES':'Fundações','LOUÇAS E METAIS':'Louças e metais','SERVIÇOS EXTRAS':'Serviços extras','PREPARATIVOS':'Preparativos','REEMBOLSO / DIVERSOS - A CLASSIFICAR':'Diversos a classificar'};return map[p]||p}

const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v||0));

const dateBR=s=>{if(!s)return'—';const d=new Date(s+'T12:00:00');return isNaN(d)?s:new Intl.DateTimeFormat('pt-BR').format(d)};
const monthBR=s=>{const [y,m]=s.split('-');return new Intl.DateTimeFormat('pt-BR',{month:'short',year:'2-digit',timeZone:'UTC'}).format(new Date(Date.UTC(+y,+m-1,1))).replace('.','')};

function kpi(label,value,sub,delta='',tone='info',tip=''){const safeTip=tip||sub;return `<div class="kpi" data-tip="${esc(safeTip)}"><div class="label">${esc(label)}</div><div class="value">${value}</div>${delta?`<div class="delta ${tone}">${esc(delta)}</div>`:''}<div class="sub">${sub}</div></div>`}

function bars(rows, maxValue, useParts=true){const id='chart'+(++chartSeq),mx=maxValue||Math.max(...rows.map(x=>x.total??x.actual??x.value??0),1);const canParts=useParts&&rows.some(r=>(r.material||0)>0||(r.labor||0)>0);return `<div class="chart-toolbar"><div class="client-status"><span class="flag">Passe o mouse ou clique em uma etapa</span></div>${canParts?`<div class="segmented" data-chart-controls="${id}"><button class="active" data-metric="total">Total</button><button data-metric="material">Material</button><button data-metric="labor">Mão de obra</button></div>`:''}</div><div class="bars" data-bar-chart="${id}" data-max-total="${mx}">${rows.map(r=>{const total=r.total??r.actual??r.value??0,label=plainPhase(r.phase||r.group||r.name),material=r.material||0,labor=r.labor||0;return `<div class="bar-row chart-row" tabindex="0" data-chart="${id}" data-label="${esc(label)}" data-total="${total}" data-material="${material}" data-labor="${labor}" title="${esc(label)} — Total ${money(total)}"><div class="bar-label">${esc(label)}</div><div class="bar-track"><span class="bar-part material" style="width:${total/mx*100}%"></span></div><div class="bar-value">${money(total)}</div></div>`}).join('')}</div>${canParts?'<div class="legend"><span><i class="m"></i>Material</span><span><i class="l"></i>Mão de obra</span></div>':''}<div class="chart-readout" id="${id}-readout"><strong>Como ler este gráfico</strong><p>As barras maiores representam as etapas que mais consumiram recursos. Use os botões acima para alternar entre custo total, material e mão de obra.</p></div>`}
function lineSvg(rows){const W=760,H=260,p=34,vals=rows.map(x=>x.cumulative),mx=Math.max(...vals,1),n=rows.length;const pts=vals.map((v,i)=>[p+(W-2*p)*(i/(Math.max(n-1,1))),H-p-(H-2*p)*(v/mx)]);const poly=pts.map(q=>q.join(',')).join(' '),area=`${p},${H-p} ${poly} ${W-p},${H-p}`;const labels=rows.map((r,i)=>i%2===0?`<text x="${pts[i][0]}" y="${H-10}" text-anchor="middle">${esc(monthBR(r.month))}</text>`:'').join('');const grids=[.25,.5,.75,1].map(fr=>{const y=H-p-(H-2*p)*fr;return `<line class="grid" x1="${p}" x2="${W-p}" y1="${y}" y2="${y}"/><text x="${p-8}" y="${y+3}" text-anchor="end">${Math.round(mx*fr/1000)}k</text>`}).join('');return `<svg class="svgchart chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grids}<polygon class="area" points="${area}"/><polyline class="line" points="${poly}"/>${pts.map((q,i)=>`<circle class="point" cx="${q[0]}" cy="${q[1]}" r="3.3"><title>${esc(monthBR(rows[i].month))}: acumulado ${money(rows[i].cumulative)}</title></circle>`).join('')}${labels}</svg>`}
function monthlyBars(){const mx=Math.max(...D.monthly.map(x=>x.total),1);return `<div class="stack-months">${D.monthly.map((x,i)=>{const h=x.total/mx*220,hm=(x.material/x.total||0)*h,hl=(x.labor/x.total||0)*h;return `<div class="month-col interactive-month" tabindex="0" data-month-index="${i}" data-month="${esc(monthBR(x.month))}" data-total="${x.total}" data-material="${x.material}" data-labor="${x.labor}" data-cumulative="${x.cumulative}" title="Clique para ver os detalhes de ${esc(monthBR(x.month))}"><div class="month-bars"><div class="lab" style="height:${hl}px"></div><div class="mat" style="height:${hm}px"></div></div><div class="month-label">${esc(monthBR(x.month))}</div></div>`}).join('')}</div><div class="legend"><span><i class="m"></i>Material</span><span><i class="l"></i>Mão de obra</span></div><div class="chart-readout" id="monthReadout"><strong>Selecione um mês</strong><p>Clique em uma coluna para ver quanto foi gasto naquele mês e quanto a obra acumulava até ali.</p></div>`}

a original. Mudanças de escopo, padrão de acabamento, preços efetivos, quantidades e realocação de custos entre etapas podem gerar diferenças. O cruzamento serve para <b>identificar onde investigar</b>.`)}`)}</div>${section('Para onde foi o dinheiro','Clique nas etapas e alterne entre Total, Material e Mão de obra.')}${card('Custos por etapa','Uma barra maior significa que aquela fase recebeu mais recursos.',bars(D.phaseRows.slice(0,10)))}` }
function cross(){const counts={over:D.comparison.filter(x=>x.usage>1).length,warn:D.comparison.filter(x=>x.usage<=1&&x.usage>.85).length,good:D.comparison.filter(x=>x.usage<=.85).length};return hero()+pageGuide('O que é “Banco × Real”?','É uma comparação entre o <b>orçamento original enviado ao banco</b> e o que efetivamente já foi gasto em cada grupo de serviço. Administração e custos indiretos ficam fora para evitar comparar coisas diferentes.')+`<div class="grid g4">${kpi('Orçamento global do banco',money(D.summary.bankGlobal),'Valor total do orçamento original, incluindo itens que não entram no comparativo direto.')}${kpi('Base que pode ser comparada',money(D.summary.bankComparable),'Parcela física usada para comparar material + mão de obra.')}${kpi('Realizado já associado',money(D.summary.mappedTotal),'Custos que já conseguimos ligar aos grupos equivalentes do banco.')}${kpi('Diretos ainda a vincular',money(D.summary.extraDirect),'Valores diretos que ainda precisam de classificação mais precisa.','Revisar classificação','warn')}</div>${section('Cruzamento por grupo de serviço','Use os filtros para simplificar a leitura.')}${card('Matriz Banco × Real','Clique em uma linha para ver a explicação daquele grupo.',`<div class="cross-controls"><div class="segmented" id="crossFilters"><button class="active" data-cross-filter="all">Todos</button><button data-cross-filter="over">Acima (${counts.over})</button><button data-cross-filter="warn">Próximo do limite (${counts.warn})</button><button data-cross-filter="good">Dentro (${counts.good})</button></div><div class="client-status"><span class="flag">Desvio positivo = gasto acima da referência</span></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Grupo</th><th class="num">Previsto banco</th><th class="num">Material</th><th class="num">Mão de obra</th><th class="num">Já gasto</th><th class="num">Diferença</th><th>Uso da referência</th><th>Situação</th></tr></thead><tbody>${D.comparison.map((x,i)=>{co function stages(){return hero()+pageGuide('Para que serve esta página?','Ela responde <b>em quais partes da casa o dinheiro foi aplicado</b>. O valor de cada etapa reúne materiais e mão de obra atribuídos àquela fase.')+`<div class="grid g3">${kpi('Etapas com custo identificado',D.phaseRows.length,'Quantidade de fases que possuem gasto direto classificado.')}${kpi('Etapa de maior custo',esc(plainPhase(D.phaseRows[0]?.phase||'—')),D.phaseRows[0]?money(D.phaseRows[0].total):'—')}${kpi('Custos a classificar melhor',money(D.summary.extraDirect),'Valores reais, mas ainda sem equivalência perfeita com o orçamento do banco.','Revisão necessária','warn')}</div>${section('Mapa de custos por etapa','Clique em uma etapa e use os botões para alternar a visão.')}${card('Ranking das etapas','Mostra onde o custo direto está mais concentrado.',bars(D.phaseRows,null,true))}${section('Detalhamento completo','A tabela abaixo mostra a mesma informação em números.')}${card('Tabela analítica','“% do direto” mostra quanto cada etapa representa dos ${money(D.summary.directTotal)} já gastos.',`<div class="table-wrap"><table class="table"><thead><tr><th>Etapa</th><th class="num">Material</th><th class="num">Mão de obra</th><th class="num">Total</th><th class="num">Participação</th></tr></thead><tbody>${D.phaseRows.map(r=>`<tr><td><strong>${esc(plainPhase(r.phase))}</strong></td><td class="num">${money(r.material)}</td><td class="num">${money(r.labor)}</td><td class="num strong">${money(r.total)}</td><td class="num">${pct(r.total/D.summary.directTotal)}</td></tr>`).join('')}</tbody></table></div>${layHelp('Exemplo de leitura',`Se uma etapa representa 20% do custo direto, significa que, de todo o valor identificado como material + mão de obra até hoje, cerca de R$ 20 em cada R$ 100 foram aplicados nela.`)}`)}` }
function labor(){const summary=[...D.laborAllocationSummary].sort((a,b)=>b.value-a.value);return hero()+pageGuide('Como a mão de obra foi tratada?','Parte dos pagamentos de equipe veio sem indicar claramente a etapa executada. Para não deixar esse valor solto, o painel criou um <b>rateio gerencial</b>: uma distribuição analítica por fase, sem alterar nenhum lançamento original.')+`<div class="grid g4">${kpi('Mão de obra total',money(D.summary.labor),'Todos os pagamentos classificados como mão de obra.')}${kpi('Mão de obra que precisou ser rateada',money(D.summary.allocatedLabor),'Pagamentos sem etapa original clara.','Distribuída para análise','ok')}${kpi('Mão de obra ligada ao acabamento',money(D.summary.finishingLabor),`${pct(D.summary.finishingLabor/D.summary.labor)} de toda a mão de obra direta.`)}${kpi('Maior destino do rateio',esc(plainPhase(summary[0]?.phase||'—')),summary[0]?money(summary[0].value):'—')}</div><div class="grid g2 mt14">${card('Mão de obra por etapa','Clique em uma barra para ver o valor da fase.',bars(D.phaseRows.filter(x=>x.labor>0).map(x=>({phase:x.phase,total:x.labor})),null,false))}${card('Como o rateio ficou distribuído','Apenas visão gerencial; os pagamentos originais permanecem intactos.',`<div class="mini-list">${summary.map(r=>`<div class="mini-row"><div><div class="mini-name">${esc(plainPhase(r.phase))}</div><div class="progress"><span style="width:${r.value/(summary[0]?.value||1)*100}%"></span></div></div><div class="mini-amt">${money(r.value)}</div></div>`).join('')}</div>${layHelp('O que significa “rateio”?','É apenas uma forma de distribuir um pagamento sem etapa definida entre fases prováveis, usando a proximidade temporal e o perfil dos demais gastos. Ele melhora a leitura, mas deve ser validado quando houver uma medição ou documento mais preciso.')}`)}</div>${section('Memória do rateio','Transparência sobre quais pagamentos foram distribuídos e por qual critério.')}${card('Lançamentos rateados','',`<div class="table-wrap"><table class="table"><thead><tr><th>Data</th><th>Descrição</th><th class="num">Valor</th><th>Critério</th><th>Distribuição</th></tr></thead><tbody>${D.laborAllocation.map(a=>`<tr><td>${dateBR(a.date)}</td><td>${esc(a.description)}</td><td class="num strong">${money(a.value)}</td><td>${esc(a.method)}</td><td>${a.allocations.map(x=>`<span class="pill" style="margin:2px">${esc(plainPhase(x.phase))}: ${money(x.value)}</span>`).join('')}</td></tr>`).join('')}</tbody></table></div>`)}` }
function finish(){return hero()+pageGuide('Por que o acabamento merece uma página própria?','Nesta fase, a obra passa a concentrar muitos itens de maior valor unitário, escolhas de padrão e serviços simultâneos. Para o cliente, é a etapa em que <b>controle de compras, perdas, retrabalho e medições</b> fica ainda mais importante.')+`<div class="grid g4">${kpi('Custos ligados ao acabamento',money(D.summary.finishingTotal),'Soma das etapas classificadas como acabamento nesta análise.')}${kpi('Materiais de acabamento',money(D.summary.finishingMaterial),`${pct(D.summary.finishingMaterial/D.summary.finishingTotal)} do custo de acabamento.`)}${kpi('Mão de obra de acabamento',money(D.summary.finishingLabor),`${pct(D.summary.finishingLabor/D.summary.finishingTotal)} do custo de acabamento.`)}${kpi('Peso no custo direto',pct(D.summary.finishingTotal/D.summary.directTotal),`Parte dos ${money(D.summary.directTotal)} já gastos que está nas etapas de acabamento.`)}</div>${section('Onde o acabamento está consumindo mais','Clique nas etapas e alterne entre Total, Material e Mão de obra.')}${card('Composição do acabamento','Uma barra maior indica maior gasto acumulado naquela fase.',bars(D.finishRows,null,true))}${section('Orientação para o cliente','O que vale acompanhar de perto agora.')}${card('Pontos de controle em linguagem simples','',`<div class="alerts"><div class="alert"><i class="pin"></i><div><strong>Revestimentos e pisos</strong><p>Conferir quantidades compradas, perdas, recortes, paginação e necessidade real antes de compras complementares.</p></div><div class="metric">${money(D.finishRows.find(x=>x.phase==='REVESTIMENTOS')?.total||0)}</div></div><div class="alert"><i class="pin"></i><div><strong>Pintura</strong><p>Separar correções/retrabalhos da pintura normal e comparar consumo de material com produtividade da equipe.</p></div><div class="metric">${money(D.finishRows.find(x=>x.phase==='PINTURAS')?.total||0)}</div></div><div class="alert ok"><i class="pin"></i><div><strong>Esquadrias, instalações, louças e metais</strong><p>Vincular pagamento a ambiente e serviço facilita conferir o que já foi entregue e o que ainda está pendente.</p></div></div></div>${layHelp('Importante','“Acabamento” aqui é uma classificação gerencial do painel. Ela reúne fases que influenciam o fechamento da obra, mas não representa sozinha o percentual físico concluído.')}`)}` }
function measurements(){let rows=[];try{rows=JSON.parse(safeGet('altiplan_medicoes_v3')||'[]')}catch(e){};const total=rows.reduce((a,x)=>a+Number(x.valor||0),0);return hero()+pageGuide('O que é uma medição?','É o registro de <b>quanto de um serviço foi realmente executado</b> em determinado período. Ela é diferente de pagamento: primeiro mede-se a produção; depois o valor pode ser aprovado e pago.')+`<div class="grid g3">${kpi('Medições cadastradas',rows.length,'Quantidade de boletins registrados neste navegador.')}${kpi('Valor total medido',money(total),'Soma dos valores informados nas medições.')}${kpi('Última medição',rows.length?dateBR([...rows].sort((a,b)=>String(a.data).localeCompare(String(b.data))).slice(-1)[0].data):'—','Data do boletim mais recente cadastrado.')}</div><div class="quick-defs lay-help mt14"><div class="quick-def"><strong>Valor do contrato</strong><p>Quanto foi combinado para executar todo aquele serviço.</p></div><div class="quick-def"><strong>% medido</strong><p>Quanto do serviço foi produzido até o ponto que está sendo registrado.</p></div><div class="quick-def"><strong>Valor da medição</strong><p>Quanto corresponde à produção reconhecida naquele boletim.</p></div></div><div class="grid g2 mt14">${card('Cadastrar nova medição','Preencha os campos abaixo para criar um histórico de produção.',`<form id="medForm"><div class="form-grid"><div class="field"><label>Boletim</label><input name="boletim" placeholder="Ex.: BM 01"></div><div class="field"><label>Data</label><input type="date" name="data" required></div><div class="field"><label>Etapa da obra</label><select name="etapa">${D.phaseRows.map(r=>`<option>${esc(r.phase)}</option>`).join('')}</select></div><div class="field"><label>Serviço executado</label><input name="servico" required placeholder="Ex.: Assentamento de porcelanato"></div><div class="field"><label>Empresa / equipe</label><input name="contratada" placeholder="Quem executou"></div><div class="field"><label>Valor total do contrato</label><input name="contrato" type="number" step="0.01"></div><div class="field"><label>% medido</label><input name="percentual" type="number" step="0.01" min="0" max="100"></div><div class="field"><label>Valor desta medição</label><input name="valor" type="number" step="0.01" required></div><div class="field"><label>Situação</label><select name="status"><option>Em análise</option><option>Aprovada</option><option>Paga</option></select></div><div class="field span2"><label>Observações</label><textarea name="obs" placeholder="Pendências, retenções, ambientes concluídos, observações da fiscalização..."></textarea></div></div><div class="form-actions"><button class="btn primary" type="submit">Salvar medição</button></div></form>`)}${card('Como preencher corretamente','Três cuidados evitam confusão depois.',`<div class="alerts"><div class="alert ok"><i class="pin"></i><div><strong>Use uma etapa específica</strong><p>Ex.: revestimentos, pintura ou hidráulica. Isso melhora o cruzamento financeiro.</p></div></div><div class="alert"><i class="pin"></i><div><strong>Não confunda medido com pago</strong><p>O serviço pode estar executado e aprovado, mas ainda não ter sido pago.</p></div></div><div class="alert"><i class="pin"></i><div><strong>Registre observações</strong><p>Pendências e retenções explicam por que a medição pode ser diferente do valor esperado.</p></div></div></div>`)}</div>${section('Histórico de medições','Os registros abaixo ficam salvos localmente neste navegador.')}${card('Medições cadastradas','',rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>BM</th><th>Data</th><th>Etapa</th><th>Serviço</th><th>Empresa / equipe</th><th class="num">Contrato</th><th class="num">%</th><th class="num">Medição</th><th>Situação</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.boletim||'—')}</td><td>${dateBR(r.data)}</td><td>${esc(plainPhase(r.etapa))}</td><td>${esc(r.servico)}</td><td>${esc(r.contratada||'—')}</td><td class="num">${money(r.contrato)}</td><td class="num">${num(r.percentual)}%</td><td class="num strong">${money(r.valor)}</td><td><span class="pill">${esc(r.status)}</span></td><td><button class="btn" data-del="${esc(r.id)}">Excluir</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhuma medição cadastrada ainda.</div>')}` }
function flow(){const dates=D.transactions.map(x=>x.date).filter(Boolean).sort(),peak=[...D.monthly].sort((a,b)=>b.total-a.total)[0];return hero()+pageGuide('O que esta página mostra?','Ela mostra <b>quando o dinheiro foi sendo gasto</b>. A curva acumulada cresce ao longo do tempo; as colunas mostram quanto foi desembolsado em cada mês.')+`<div class="grid g3">${kpi('Primeiro custo direto',dateBR(dates[0]),'Primeiro lançamento de material ou mão de obra na base.')}${kpi('Último custo direto',dateBR(dates.at(-1)),'Último lançamento existente na planilha atual.')}${kpi('Mês de maior desembolso',monthBR(peak.month),`${money(peak.total)} em material + mão de obra.`)}</div><div class="grid g2 mt14">${card('Evolução acumulada do custo','A linha sempre sobe porque soma todos os custos desde o início.',lineSvg(D.monthly)+layHelp('Como ler a Curva S',`Cada ponto representa o total acumulado até aquele mês. Uma inclinação mais forte significa que a obra gastou mais rapidamente naquele período.`))}${card('Quanto foi gasto em cada mês','Clique em uma coluna para ver material, mão de obra e acumulado.',monthlyBars())}</div>` }
function m2(){const area=D.project.area,cost=D.summary.directTotal/area,bank=D.summary.bankComparable/area,high=D.benchmark.cubHighR1Jul2026,general=D.benchmark.cubGeneralAug2026,max=Math.max(cost,bank,high,general)*1.15,pos=v=>Math.min(v/max*100,100),diff=(cost/high-1)*100;return hero()+pageGuide('Por que olhar custo por m²?','Dividir o custo pela área permite comparar obras de tamanhos diferentes. Nesta casa, usamos uma área fixa de <b>200,32 m²</b> e padrão <b>alto</b>. A comparação com o CUB é apenas uma referência de mercado, não um orçamento de conclusão.')+`<div class="grid g4">${kpi('Custo direto acumulado / m²',money(cost),'Já gasto em material + mão de obra dividido por 200,32 m².',`${diff>=0?'+':''}${diff.toFixed(1).replace('.',',')}% vs R1-A`,Math.abs(diff)<5?'ok':'warn')}${kpi('Referência do banco / m²',money(bank),'Base comparável do banco dividida pela mesma área.')}${kpi('CUB-CE R1 alto',money(high),'Referência de residência unifamiliar de padrão alto — jul/2026.')}${kpi('CUB-CE geral onerado',money(general),'Referência geral do Ceará — ago/2026.')}</div><div class="grid g2 mt14">${card('Leitura para esta residência','A casa é de alto padrão e possui 200,32 m².',`<div class="m2-hero-comparison"><div class="comparison-big"><span class="vs">OBRA ATÉ AGORA</span><div class="big-number">${money(cost)}/m²</div><p>Este valor ainda é <strong>acumulado parcial</strong>, porque a obra está em acabamento e ainda haverá custos até a conclusão.</p></div><div class="comparison-big"><span class="vs">REFERÊNCIA R1 ALTO</span><div class="big-number">${money(high)}/m²</div><p>Referência CUB para padrão alto. O CUB possui metodologia e exclusões próprias, por isso não substitui o orçamento real da casa.</p></div></div>${layHelp('Interpretação correta',`Hoje, o custo direto acumulado está ${Math.abs(diff).toFixed(1).replace('.',',')}% ${diff>=0?'acima':'abaixo'} da referência R1-A. Como a obra ainda não terminou, <b>não é correto concluir economia ou estouro final somente por essa comparação</b>.`,'warn')}`)}${card('Escala comparativa','Veja onde cada referência fica na mesma régua.',`<div class="m2-scale"><div class="m2-line"></div>${[['CUB geral',general],['R1 alto',high],['Banco',bank],['Obra atual',cost]].map(([l,v])=>`<div class="marker" style="left:${pos(v)}%"><span>${l} · ${money(v)}</span></div>`).join('')}</div>`)}</div><div class="grid g2 mt14">${card('Glossário rápido','',`<div class="quick-defs"><div class="quick-def"><strong>Custo direto</strong><p>Material + mão de obra aplicados na execução.</p></div><div class="quick-def"><strong>CUB</strong><p>Custo Unitário Básico, uma referência padronizada do setor.</p></div><div class="quick-def"><strong>R1-A</strong><p>Projeto padrão de residência unifamiliar de padrão alto usado como referência.</p></div></div>`)}${card('Referências utilizadas','',`<div class="source-list">${D.benchmark.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noreferrer">${esc(s.label)}</a>`).join('')}</div>`)}</div>` }

function renderLedger(search,phase,ref){const phases=['TODAS',...new Set(D.transactions.map(x=>x.phase).filter(Boolean))],refs=['TODAS','MATERIAL DE OBRA','MÃO DE OBRA'];const f=D.transactions.filter(t=>(phase==='TODAS'||t.phase===phase)&&(ref==='TODAS'||t.reference===ref)&&(!search||[t.description,t.supplier,t.receiver,t.phase].join(' ').toLowerCase().includes(search.toLowerCase())));return hero()+pageGuide('Para que serve a lista de lançamentos?','É a <b>memória detalhada</b> que sustenta os números do painel. Aqui é possível conferir datas, fornecedores, descrições, etapas e valores, além de pesquisar e filtrar.')+`<div class="grid g3">${kpi('Lançamentos diretos',D.summary.directTransactions,'Somente material e mão de obra.')}${kpi('Filtrados',f.length,'Quantidade após os filtros atuais.')}${kpi('Valor filtrado',money(f.reduce((a,x)=>a+Number(x.value||0),0)),'Administração e custos indiretos não aparecem.')}</div><div class="section-title"><div><h2>Razão de custos diretos</h2><p>Base auditável dos valores usados no dashboard.</p></div><div class="filters"><input id="ledgerSearch" class="control search" value="${esc(search)}" placeholder="Buscar fornecedor, descrição..."><select id="ledgerPhase" class="control">${phases.map(x=>`<option ${x===phase?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="ledgerRef" class="control">${refs.map(x=>`<option ${x===ref?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div>${card('Lançamentos','Somente custos que entram nos indicadores de material e mão de obra.',`<div class="table-wrap" style="max-height:640px"><table class="table"><thead><tr><th>#</th><th>Data</th><th>Etapa</th><th>Referência</th><th>Fornecedor</th><th>Descrição</th><th class="num">Valor</th><th>Pagador</th></tr></thead><tbody>${f.map(t=>`<tr><td>${esc(t.id)}</td><td>${dateBR(t.date)}</td><td>${esc(t.phase)}</td><td><span class="pill">${esc(t.reference)}</span></td><td>${esc(t.supplier||'—')}</td><td style="min-width:250px">${esc(t. function latestDataDate(){const a=D.transactions.map(x=>x.date).filter(Boolean).sort();return a.length?a[a.length-1]:''}
function loadJSON(key,fallback){try{const v=JSON.parse(safeGet(key)||'null');return v??fallback}catch(e){return fallback}}
function saveJSON(key,value){safeSet(key,JSON.stringify(value))}
function projectionSettings(){const v=loadJSON(V4.projectionKey,{progress:70});let p=Number(v.progress||70);if(!isFinite(p))p=70;p=Math.max(60,Math.min(90,p));return {progress:p}}
function projectionCalc(progress){const spent=Number(D.summary.directTotal||0),p=Math.max(.01,Number(progress||70)/100),final=spent/p,remaining=Math.max(0,final-spent),m2=final/Number(D.project.area||1);return {spent,progress:p*100,final,remaining,m2}}
function scenarioCalc(progress){const base=projectionCalc(progress),lo=projectionCalc(Math.min(90,progress+5)),hi=projectionCalc(Math.max(60,progress-5));return {base,low:lo,high:hi}}
function refinanceData(){const groups={};D.comparison.forEach(x=>groups[x.group]=0);const base={date:'',institution:'',operation:'',total:0,comparable:0,notes:'',groups};const saved=loadJSON(V4.refiKey,{});return {...base,...saved,groups:{...groups,...(saved.groups||{})}}}
function hasRefinance(r=refinanceData()){return Number(r.total||0)>0||Number(r.comparable||0)>0||Object.values(r.groups||{}).some(v=>Number(v||0)>0)}
function refiComparable(r=refinanceData()){const groupSum=Object.values(r.groups||{}).reduce((a,v)=>a+Number(v||0),0);return Number(r.comparable||0)||groupSum||0}
function escAttr(v){return esc(v).replace(/`/g,'&#96;')}

async function imageToBlob(file){
 const max=1800,quality=.84;
 try{
   const bmp=await createImageBitmap(file),scale=Math.min(1,max/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*scale),h=Math.round(bmp.height*scale),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(bmp,0,0,w,h);bmp.close?.();
   return await new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',quality));
 }catch(e){return file}
}

openProjectDocument=function(id){const d=DriveProjectService.get(id);if(!d)return;selectedProjectId=id;renderProjectList();const idx=PROJECT_DOCS.findIndex(x=>x.id===id),title=document.getElementById('viewerTitle'),disc=document.getElementById('viewerDiscipline'),viewer=document.getElementById('projectViewer'),meta=document.getElementById('projectMeta'),note=document.getElementById('projectViewerNote'),open=document.getElementById('openProjectDrive'),reload=document.getElementById('reloadProject'),pos=document.getElementById('viewerPosition'),prev=document.getElementById('prevProject'),next=document.getElementById('nextProject');if(title)title.textContent=d.name;if(disc)disc.textContent='Projeto arquitetônico';if(pos)pos.textContent=`${idx+1} / ${PROJECT_DOCS.length}`;if(prev)prev.disabled=idx<=0;if(next)next.disabled=idx>=PROJECT_DOCS.length-1;if(meta)meta.innerHTML=`<div><span>Disciplina</span><strong>Projeto arquitetônico</strong></div><div><span>Origem</span><strong>Google Drive da obra</strong></div><div><span>Atualização do arquivo</span><strong>${dateBR(d.modified)}</strong></div><div><span>Tamanho</span><strong>${DriveProjectService.humanSize(d.size)}</strong></div>`;if(open){open.disabled=false;open.onclick=()=>window.open(DriveProjectService.viewUrl(d),'_blank','noopener,noreferrer')}if(reload){reload.disabled=false;reload.onclick=()=>loadProjectFrame(d)}loadProjectFrame(d);if(note)note.innerHTML='Use <b>Tela cheia</b> para revisar a prancha com mais conforto. Para download ou impressão do original, use <b>Abrir no Drive</b>.'}

bindProjects=function(){const search=document.getElementById('projectSearch'),root=document.getElementById('openProjectRoot'),prev=document.getElementById('prevProject'),next=document.getElementById('nextProject'),full=document.getElementById('viewerFullscreen'),toggle=document.getElementById('toggleProjectCatalog');if(search)search.oninput=()=>{projectQuery=search.value;renderProjectList()};if(root)root.onclick=()=>window.open(PROJECT_DRIVE_ROOT,'_blank','noopener,noreferrer');if(prev)prev.onclick=()=>projectNavigate(-1);if(next)next.onclick=()=>projectNavigate(1);if(full)full.onclick=()=>toggleProjectFullscreen();if(toggle)toggle.onclick=toggleProjectCatalog;renderProjectList();if(!selectedProjectId&&PROJECT_DOCS.length)openProjectDocument(PROJECT_DOCS[0].id);else if(selectedProjectId)openProjectDocument(selectedProjectId)}

document.addEventListener('keydown',e=>{if(current!=='projetos')return;if(e.key==='Escape'){toggleProjectFullscreen(false);return}const tag=(e.target?.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select')return;if(e.key==='ArrowLeft')projectNavigate(-1);if(e.key==='ArrowRight')projectNavigate(1)});

function blobToDataURL(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)})}
function reportExecutiveText(progress,financialUsage,pr){const delta=financialUsage*100-progress;return `A obra apresenta avanço físico aproximado de ${num(progress)}% e consumo de ${pct(financialUsage)} da base direta do refinanciamento. ${delta>=0?`O consumo financeiro está ${num(delta)} pontos percentuais à frente do avanço físico informado.`:`O avanço físico está ${num(Math.abs(delta))} pontos percentuais à frente do consumo financeiro.`} O cenário linear projeta custo direto final de ${money(pr.final)}, devendo ser interpretado como referência gerencial e atualizado conforme as medições físicas.`}

async function openProfessionalReport(printNow=false){const w=window.open('','_blank');if(!w){alert('O navegador bloqueou a abertura da prévia. Autorize pop-ups para este arquivo e tente novamente.');return}w.document.open();w.document.write('<!doctype html><html><body style="font-family:Arial;padding:40px;color:#38514d">Preparando relatório profissional…</body></html>');w.document.close();try{const html=await professionalReportHTML();w.document.open();w.document.write(html);w.document.close();if(printNow){const waitImages=()=>new Promise(resolve=>{const imgs=[...w.document.images];if(!imgs.length)return resolve();let done=0;const finish=()=>{done++;if(done>=imgs.length)resolve()};imgs.forEach(i=>i.complete?finish():(i.onload=finish,i.onerror=finish));setTimeout(resolve,3500)});await waitImages();setTimeout(()=>{w.focus();w.print()},250)}}catch(e){w.document.body.innerHTML='<p style="font-family:Arial;padding:30px">Não foi possível gerar o relatório: '+String(e.message||e)+'</p>'}}

function projectEmbeddedUrl(doc){
 if(!doc||!PROJECT_PDF_EMBEDDED[doc.id])return null;
 if(PROJECT_PDF_URL_CACHE[doc.id])return PROJECT_PDF_URL_CACHE[doc.id];
 const bin=atob(PROJECT_PDF_EMBEDDED[doc.id]),len=bin.length,bytes=new Uint8Array(len);
 for(let i=0;i<len;i++)bytes[i]=bin.charCodeAt(i);
 const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));PROJECT_PDF_URL_CACHE[doc.id]=url;return url;
}
loadProjectFrame=function(d){const viewer=document.getElementById('projectViewer');if(!viewer||!d)return;const u=projectEmbeddedUrl(d);viewer.classList.add('loading');if(u){viewer.innerHTML=`<iframe title="${escAttr(d.name)}" src="${escAttr(u)}#toolbar=1&navpanes=0&scrollbar=1&view=FitH" allow="fullscreen" allowfullscreen loading="eager"></iframe>`}else{viewer.innerHTML=`<iframe title="${escAttr(d.name)}" src="${escAttr(DriveProjectService.previewUrl(d))}" allow="autoplay; fullscreen" allowfullscreen loading="eager"></iframe>`}const fr=viewer.querySelector('iframe');if(fr)fr.onload=()=>viewer.classList.remove('loading');setTimeout(()=>viewer.classList.remove('loading'),1800)};

openProjectDocument=function(id){_openProjectDocumentV11(id);const note=document.getElementById('projectViewerNote');if(note)note.innerHTML='PDF sincronizado do Google Drive e incorporado nesta versão do painel para evitar falhas de enquadramento. Use <b>Tela cheia</b> para revisar a prancha e <b>Abrir no Drive</b> para acessar o original.'};

function reportFinancialState(progress){const pr=projectionCalc(progress),refi=REFI_SOURCE.comparableRefi,orig=REFI_SOURCE.comparableOriginal,real=D.summary.directTotal,balance=refi-real,need=pr.final-refi,usage=real/refi,pp=usage*100-progress;return {pr,refi,orig,real,balance,need,usage,pp,deltaRefi:REFI_SOURCE.comparableDelta,realM2:real/D.project.area,refiM2:refi/D.project.area}}
function reportPressureRows(limit=5){return refiGroupRows().slice().sort((a,b)=>b.refiUsage-a.refiUsage).slice(0,limit)}
reportExecutiveText=function(progress,financialUsage,pr){const st=reportFinancialState(progress);return `A obra apresenta avanço físico aproximado de ${num(progress)}% e consumo de ${pct(financialUsage)} da base direta do refinanciamento. ${st.pp>=0?`O consumo financeiro está ${num(st.pp)} pontos percentuais à frente do avanço físico informado.`:`O avanço físico está ${num(Math.abs(st.pp))} pontos percentuais à frente do consumo financeiro.`} O custo direto realizado é ${money(st.real)} e o cenário linear projeta ${money(pr.final)} ao término, com ${money(pr.remaining)} ainda a realizar. ${st.need>0?`Nesse cenário, a necessidade potencial supera a base direta REV 03 em ${money(st.need)}.`:`Nesse cenário, a base direta REV 03 mantém folga matemática de ${money(Math.abs(st.need))}.`}`}

let projectViewerZoom=100, projectViewerMode='page';
function setProjectViewerMode(mode){
 const stage=document.getElementById('techViewerStage'); if(!stage)return;
 projectViewerMode=mode; stage.classList.remove('fit-page','fit-width','custom-zoom');
 if(mode==='page')stage.classList.add('fit-page');
 else if(mode==='width')stage.classList.add('fit-width');
 else {stage.classList.add('custom-zoom');stage.style.setProperty('--viewer-width',projectViewerZoom+'%')}
 document.querySelectorAll('[data-fit]').forEach(b=>b.classList.toggle('active',b.dataset.fit===mode));
 const z=document.getElementById('techViewerZoom');if(z)z.textContent=(mode==='custom'?projectViewerZoom+'%':mode==='page'?'Ajustar':'Largura');
}
function setProjectViewerZoom(deltaOrValue,absolute=false){
 const stage=document.getElementById('techViewerStage');if(!stage)return;
 projectViewerZoom=absolute?Number(deltaOrValue):projectViewerZoom+Number(deltaOrValue);
 projectViewerZoom=Math.max(50,Math.min(300,projectViewerZoom));
 setProjectViewerMode('custom');
 stage.style.setProperty('--viewer-width',projectViewerZoom+'%');
 const z=document.getElementById('techViewerZoom');if(z)z.textContent=projectViewerZoom+'%';
}
projectLibrary=function(){const total=PROJECT_DOCS.length;return hero()
 +`<div class="projects-hero"><div><h3>Projetos</h3><p>Central de consulta das pranchas arquitetônicas. A visualização usa uma <b>prévia técnica de alta resolução</b> para eliminar falhas do leitor PDF do navegador; o PDF vetorial original continua disponível em um clique.</p></div><div class="drive-state"><i></i>Arquivos preparados para web</div></div>`
 +`<div class="project-counts" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="project-count"><span>Documentos disponíveis</span><strong>${total}</strong><small>PDFs arquitetônicos</small></div><div class="project-count"><span>Visualização</span><strong>Alta resolução</strong><small>sem dependência do plugin PDF</small></div><div class="project-count"><span>Atualização dos arquivos</span><strong>13/11/2024</strong><small>originais assinados</small></div></div>`
 +pageGuide('Central de projetos','A prancha é enquadrada por completo ao abrir. Use <b>Ajustar</b>, <b>Largura</b> e os controles de zoom para detalhar o desenho. O botão <b>Abrir PDF</b> acessa o original vetorial.')
 +`<div class="project-toolbar"><div class="project-search"><input id="projectSearch" placeholder="Pesquisar projeto, planta, corte ou memorial..." value="${esc(projectQuery)}"></div><button class="btn" id="toggleProjectCatalog">Ocultar lista</button><button class="btn" id="openProjectRoot">Abrir pasta no Drive</button><span class="viewer-shortcut">Atalhos: ← → navegar · Esc sair da tela cheia</span></div>`
 +`<div class="project-workspace" id="projectWorkspace"><section class="project-catalog"><div class="project-catalog-head"><strong>Documentos do projeto</strong><span id="projectResultCount"></span></div><div class="project-list" id="projectList"></div></section><section class="project-viewer-card" id="projectViewerCard"><div class="project-viewer-head"><div class="project-viewer-title"><span id="viewerDiscipline">Projeto arquitetônico</span><strong id="viewerTitle">Selecione uma prancha</strong></div><div class="project-viewer-actions"><div class="viewer-step"><button id="prevProject" title="Projeto anterior">←</button><span class="viewer-position" id="viewerPosition">— / ${total}</span><button id="nextProject" title="Próximo projeto">→</button></div><button class="btn" id="viewerFullscreen">Tela cheia</button><button class="btn" id="openProjectPdf" disabled>Abrir PDF</button><button class="btn primary" id="openProjectDrive" disabled>Abrir no Drive</button></div></div><div class="project-viewer-frame" id="projectViewer"><div class="project-viewer-placeholder"><div><div class="docmark">PDF</div><strong>Visualizador de Projetos</strong><p>Selecione um documento para abrir a prancha.</p></div></div></div><div class="project-meta" id="projectMeta"><div><span>Disciplina</span><strong>Projeto arquitetônico</strong></div><div><span>Fonte do visualizador</span><strong>Arquivo web local</strong></div><div><span>Atualização</span><strong>—</strong></div><div><span>Tamanho</span><strong>—</strong></div></div><div class="project-note v13-note" id="projectViewerNote"><span class="note-dot"></span><div>A prévia em alta resolução evita o recorte e a grande área cinza do leitor PDF incorporado. O PDF original permanece disponível para impressão, download e conferência vetorial.</div></div></section></div>`;
};
loadProjectFrame=function(d){
 const viewer=document.getElementById('projectViewer');if(!viewer||!d)return;
 projectViewerZoom=100;projectViewerMode='page';viewer.classList.remove('loading');
 viewer.innerHTML=`<div class="tech-pdf-viewer"><div class="tech-viewer-toolbar"><div class="tv-left"><button data-fit="page" class="active">Ajustar</button><button data-fit="width">Largura</button><span class="tv-file">${esc(d.name)}</span></div><div class="tv-right"><button id="tvZoomOut" title="Reduzir zoom">−</button><span class="tv-zoom" id="techViewerZoom">Ajustar</span><button id="tvZoomIn" title="Aumentar zoom">+</button><button id="tvZoom100">100%</button></div></div><div class="tech-viewer-stage fit-page" id="techViewerStage"><div class="tech-viewer-paper"><img id="techViewerImage" src="${escAttr(d.preview||'')}" alt="${escAttr(d.name)}" draggable="false"></div></div></div><div class="tech-viewer-hint">Prévia de alta resolução · use Abrir PDF para o arquivo vetorial original</div>`;
 document.querySelectorAll('[data-fit]').forEach(b=>b.onclick=()=>setProjectViewerMode(b.dataset.fit));
 const zin=document.getElementById('tvZoomIn'),zout=document.getElementById('tvZoomOut'),z100=document.getElementById('tvZoom100'),stage=document.getElementById('techViewerStage');
 if(zin)zin.onclick=()=>setProjectViewerZoom(25);if(zout)zout.onclick=()=>setProjectViewerZoom(-25);if(z100)z100.onclick=()=>setProjectViewerZoom(100,true);
 if(stage)stage.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();setProjectViewerZoom(e.deltaY<0?15:-15)},{passive:false});
 const img=document.getElementById('techViewerImage');if(img){img.onload=()=>setProjectViewerMode('page');img.onerror=()=>{viewer.innerHTML='<div class="project-viewer-placeholder"><div><div class="docmark">PDF</div><strong>Prévia indisponível</strong><p>Use o botão Abrir PDF para acessar o documento original.</p></div></div>'}}
};
openProjectDocument=function(id){
 const d=DriveProjectService.get(id);if(!d)return;selectedProjectId=id;renderProjectList();const idx=PROJECT_DOCS.findIndex(x=>x.id===id),title=document.getElementById('viewerTitle'),disc=document.getElementById('viewerDiscipline'),meta=document.getElementById('projectMeta'),note=document.getElementById('projectViewerNote'),openDrive=document.getElementById('openProjectDrive'),openPdf=document.getElementById('openProjectPdf'),pos=document.getElementById('viewerPosition'),prev=document.getElementById('prevProject'),next=document.getElementById('nextProject');
 if(title)title.textContent=d.name;if(disc)disc.textContent='Projeto arquitetônico';if(pos)pos.textContent=`${idx+1} / ${PROJECT_DOCS.length}`;if(prev)prev.disabled=idx<=0;if(next)next.disabled=idx>=PROJECT_DOCS.length-1;
 if(meta)meta.innerHTML=`<div><span>Disciplina</span><strong>Projeto arquitetônico</strong></div><div><span>Fonte do visualizador</span><strong>Arquivo web local</strong></div><div><span>Atualização do arquivo</span><strong>${dateBR(d.modified)}</strong></div><div><span>Tamanho</span><strong>${DriveProjectService.humanSize(d.size)}</strong></div>`;
 if(openDrive){openDrive.disabled=false;openDrive.onclick=()=>window.open(DriveProjectService.viewUrl(d),'_blank','noopener,noreferrer')}
 if(openPdf){openPdf.disabled=!d.pdf;openPdf.onclick=()=>d.pdf&&window.open(d.pdf,'_blank','noopener,noreferrer')}
 loadProjectFrame(d);if(note)note.innerHTML='<span class="note-dot"></span><div>Visualização estável por prévia técnica em alta resolução. Use <b>Abrir PDF</b> para o original vetorial ou <b>Abrir no Drive</b> para a fonte documental.</div>';
};
bindProjects=function(){const search=document.getElementById('projectSearch'),root=document.getElementById('openProjectRoot'),prev=document.getElementById('prevProject'),next=document.getElementById('nextProject'),full=document.getElementById('viewerFullscreen'),toggle=document.getElementById('toggleProjectCatalog');if(search)search.oninput=()=>{projectQuery=search.value;renderProjectList()};if(root)root.onclick=()=>window.open(PROJECT_DRIVE_ROOT,'_blank','noopener,noreferrer');if(prev)prev.onclick=()=>projectNavigate(-1);if(next)next.onclick=()=>projectNavigate(1);if(full)full.onclick=()=>toggleProjectFullscreen();if(toggle)toggle.onclick=toggleProjectCatalog;renderProjectList();if(!selectedProjectId&&PROJECT_DOCS.length)openProjectDocument(PROJECT_DOCS[0].id);else if(selectedProjectId)openProjectDocument(selectedProjectId)};

</script>
